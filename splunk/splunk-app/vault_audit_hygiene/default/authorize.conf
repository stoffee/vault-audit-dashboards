# ---------------------------------------------------------------------------
# Auditor read-only role.
#
# The ask, in the customer's words: "a specific role for Auditors that would
# allow read-only access to meta data throughout Vault."
#
# Built from nothing rather than by inheriting Splunk's stock `user` role.
# That is deliberate: `user` ships with srchIndexesAllowed = *, so importing it
# would grant this role every index on the deployment, which is the opposite of
# the requirement. Everything below is granted explicitly.
# ---------------------------------------------------------------------------

[role_vault_auditor]

# ==== Subsumed roles ====
# Intentionally empty. Do not add importRoles here.
importRoles =

# ==== Capabilities ====
search                    = enabled
get_metadata              = enabled
get_typeahead             = enabled
rest_properties_get       = enabled
rest_apps_view            = enabled
change_own_password       = enabled
# An auditor's output IS evidence. They must be able to export a result set,
# or they cannot hand anything to a compliance reviewer.
export_results_is_visible = enabled

# ==== Deliberately NOT granted (each one is a real hole, not a formality) ====
# input_file          - `| inputcsv` any file on the Splunk server's disk
# run_collect         - `| collect` writes events into an index
# run_mcollect        - same, for metrics
# run_dump            - `| dump` writes to the filesystem
# output_file         - `| outputcsv` writes to the filesystem
# upload_lookup_files - replace a lookup, silently changing what dashboards show
# edit_spl2_modules   - author/modify SPL2 modules
# run_custom_command  - execute custom search commands
# run_sendalert       - trigger alert actions outbound
# request_remote_tok  - obtain tokens for remote Splunk instances
# delete_by_keyword   - mask events from search
# admin_all_objects / any edit_* / rest_apps_management
#
# The important one is input_file. Without it, this role cannot read anything
# on the box that is not in the two indexes named below.

# ==== Index scope ====
# The whole point of the role. Not `*`.
srchIndexesAllowed = vault_audit;vault_summary
srchIndexesDefault = vault_audit

# ==== Optional: PCI scoping ====
# Uncomment to keep a regulated namespace out of the auditor's reach entirely.
# Everything in these dashboards is metadata (paths, timestamps, identities) and
# audit logs contain no secret values by construction, but the PATH NAMES
# themselves may be considered in-scope. Decide with the compliance team; this
# is the switch, not the answer.
# srchFilter = NOT request.namespace.path="cde/"

# ==== Resource limits ====
# An auditor runs a handful of wide historical searches, not a workload.
srchJobsQuota           = 3
rtSrchJobsQuota         = 0
srchDiskQuota           = 200
srchMaxTime             = 600
cumulativeRTSrchJobsQuota = 0
