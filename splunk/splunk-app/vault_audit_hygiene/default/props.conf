[vault:audit]
# Vault audit devices emit one JSON object per line.
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
category = Structured

# Timestamp handling is load-bearing: every hygiene and rotation number is an AGE.
# A misparse here does not error, it silently shifts every bucket.
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9Q
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

[vault:secret:lastseen]
# Rows written by `collect` into vault_summary.
KV_MODE = json
SHOULD_LINEMERGE = false

[vault:lease:snapshot]
# One JSON object per line, written by bin/vault-lease-inventory.py, appended on
# every poll. NOT the audit schema: fields are mount/role/lease_id/issue_time/
# expire_time/ttl_seconds/days_to_expiry/bucket/renewable/verified_engine/polled_at.
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
category = Structured
TIME_PREFIX = "polled_at"\s*:\s*
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
