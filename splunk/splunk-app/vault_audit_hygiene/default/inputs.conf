# EXAMPLE ONLY - disabled. Copy to local/inputs.conf, set your real path, enable.
#
# Point this at wherever your Vault audit device or log shipper writes.
# The events must be the NESTED Vault audit schema (request.*, auth.*, response.*).
# If your pipeline flattens events, reshape before indexing or every search here
# returns zero with no error.
#
# Do not modify a file while a monitor input is watching it. Rewriting it in
# place changes the CRC and Splunk re-ingests the whole file as duplicates.

[monitor:///path/to/your/vault-audit.log]
disabled = true
index = vault_audit
sourcetype = vault:audit

# EXAMPLE ONLY - disabled. Splunk runs this itself, on the interval below, no
# external cron. VERIFIED against a real Vault, a real Postgres backend, and a real
# Splunk 10.4.3 instance: this exact mechanism ran the poller on schedule and indexed
# real leases with zero plaintext credentials anywhere in this file.
#
# Setup, before enabling:
#   1. Store the Vault token in Splunk's OWN credential store (never in this file, an
#      env var, or a wrapper script). One-time, via Splunk's REST API:
#        curl -k -u <splunk-admin>:<pw> \
#          https://localhost:8089/servicesNS/nobody/vault_audit_hygiene/storage/passwords \
#          -d name=vault_lease_poller_token -d realm=vault_audit_hygiene \
#          -d password=<your-vault-token>
#      Splunk encrypts it at rest with the instance's own splunk.secret.
#   2. Set --vault-addr and --engines below for your estate.
#   3. Enable this stanza and restart, or reload inputs.
#
# HOW THE CREDENTIAL REACHES THE SCRIPT WITHOUT EVER TOUCHING DISK IN THE CLEAR:
# `passAuth = splunk-system-user` makes Splunk hand this script a real session key
# on stdin at every scheduled run. The script uses that key to call Splunk's own
# REST API (https://localhost:8089, loopback only) and read back the credential
# stored in step 1, decrypted server-side. Verified: the FIRST invocation right
# after a restart can arrive with an empty session key (Splunk itself has not
# finished generating one yet); the script exits cleanly in that case and Splunk's
# own scheduler retries on the next interval, so this is a startup transient, not
# a failure to fix.
#
# ⚠️ Splunk's `[script://...]` stanzas do NOT support a separate `args=` key. The
# only way to pass command-line arguments is inside the stanza name itself, as
# below. This was verified the hard way: an `args=` line is silently ignored, the
# script receives zero arguments, and the failure looks like a credential problem
# when it is actually an inputs.conf syntax problem.
[script://./bin/vault-lease-inventory.py --vault-addr https://your-vault:8200 --engines database --splunk-credential vault_audit_hygiene:vault_lease_poller_token --stdout]
disabled = true
interval = 300
sourcetype = vault:lease:snapshot
index = vault_leases
passAuth = splunk-system-user
