# Audit events land here. Sized for a lab sample, not production.

[vault_audit]
homePath   = $SPLUNK_DB/vault_audit/db
coldPath   = $SPLUNK_DB/vault_audit/colddb
thawedPath = $SPLUNK_DB/vault_audit/thaweddb
maxTotalDataSizeMB = 5000
# 24 months: the hygiene searches ask an 18-month question, so the index must outlive it.
frozenTimePeriodInSecs = 63072000

# Destination for the `collect` rollup (the production form of the hygiene fold).

[vault_summary]
homePath   = $SPLUNK_DB/vault_summary/db
coldPath   = $SPLUNK_DB/vault_summary/colddb
thawedPath = $SPLUNK_DB/vault_summary/thaweddb
maxTotalDataSizeMB = 1000
frozenTimePeriodInSecs = 94608000

# Real audit events pulled from the personal home lab, for SCHEMA VALIDATION only.
# Personal data: never screenshot for a customer, never commit to the public repo.
